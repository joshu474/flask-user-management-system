{% extends "base.html" %}

{% block title %}Audit Trail{% endblock %}

{% block content %}

<h2 class="mb-4">Audit Trail</h2>

<table class="table table-striped table-bordered">

    <thead class="table-dark">
        <tr>
            <th>User</th>
            <th>Action</th>
            <th>Details</th>
            <th>Date & Time</th>
        </tr>
    </thead>

    <tbody>

    {% for log in logs %}

    <tr>
        <td>{{ log[0] }}</td>
        <td>{{ log[1] }}</td>
        <td>{{ log[2] }}</td>
        <td>{{ log[3] }}</td>
    </tr>

    {% endfor %}

    </tbody>

</table>

<a href="{{ url_for('dashboard') }}"
   class="btn btn-primary">
    Back to Dashboard
</a>

{% endblock %}
