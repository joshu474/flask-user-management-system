{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header text-center">
                <h3>Choose a New Password</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label>New Password</label>
                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">
                        Reset Password
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
