{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<h2>Forgot Password</h2>

<form method="POST">

    <div class="mb-3">
        <label>Email Address</label>

        <input
            type="email"
            name="email"
            class="form-control"
            required>
    </div>

    <button class="btn btn-primary">
        Send Reset Link
    </button>

    <a href="{{ url_for('login') }}"
       class="btn btn-secondary">
        Back
    </a>

</form>

{% endblock %}
